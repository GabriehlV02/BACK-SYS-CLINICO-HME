name: CI sistema clínico

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Validación y pruebas PHP
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, pdo_sqlite, sqlite3
          tools: composer:v2

      - name: Validar configuración de Composer
        run: composer validate --strict

      - name: Instalar dependencias PHP
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Preparar entorno de pruebas
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Ejecutar pruebas
        run: php artisan test

  assets:
    name: Compilar recursos
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar recursos Laravel
        run: npm run build
