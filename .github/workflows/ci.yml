name: CI sistema clínico

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Validación y pruebas PHP
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clinico_hme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clinico_hme_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: clinico_hme_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      USUARIOS_DB_CONNECTION: pgsql
      USUARIOS_DB_HOST: 127.0.0.1
      USUARIOS_DB_PORT: 5432
      USUARIOS_DB_DATABASE: sys_conta_hme_test
      USUARIOS_DB_USERNAME: postgres
      USUARIOS_DB_PASSWORD: postgres
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_pgsql, pgsql
          tools: composer:v2

      - name: Validar configuración de Composer
        run: composer validate --strict

      - name: Instalar dependencias PHP
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Preparar entorno de pruebas
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php <<'PHP'
          <?php
          $pdo = new PDO('pgsql:host=127.0.0.1;port=5432;dbname=postgres', 'postgres', 'postgres');
          $pdo->exec('CREATE DATABASE sys_conta_hme_test');
          PHP

      - name: Ejecutar pruebas
        run: php artisan test

  assets:
    name: Compilar recursos
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar recursos Laravel
        run: npm run build
